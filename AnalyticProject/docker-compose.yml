services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: analyticsaas
      POSTGRES_PASSWORD: analyticsaas
      POSTGRES_DB: analyticsaas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U analyticsaas -d analyticsaas']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
